name: Publish ESP component

# Publishes raws-labs/tigris-runtime to the ESP Component Registry
# (components.espressif.com) on each version tag. The runtime's dual-mode root
# CMakeLists makes the repository itself the component.
#
# Prerequisites before this can succeed:
#   1. The `raws-labs` namespace approved by Espressif.
#   2. Auth configured — either OIDC trust for this repository (used below, no
#      stored secret), or an IDF_COMPONENT_API_TOKEN repository secret (see the
#      commented lines). Until then this job will fail; it only runs on tags.
#
# Version comes from the tag (github.ref_name). Keep idf_component.yml's version
# field in step with the tag you push.

on:
  push:
    tags:
      - "v*"

jobs:
  upload:
    if: github.repository == 'raws-labs/tigris-runtime'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC auth to the registry (no long-lived secret)
    steps:
      - uses: actions/checkout@v4
      - name: Upload to ESP Component Registry
        uses: espressif/upload-components-ci-action@v2
        with:
          namespace: "raws-labs"
          components: "tigris-runtime:."
          version: ${{ github.ref_name }}
          skip_pre_release: "true"
          # Token fallback if OIDC is not configured with the registry: remove
          # the `permissions:` block above, add an IDF_COMPONENT_API_TOKEN
          # repository secret, and uncomment the next line.
          # api_token: ${{ secrets.IDF_COMPONENT_API_TOKEN }}
