name: Runtime CI

on:
  push:
    branches: [develop]
    # A release tag runs only the capability contract, which checks the tag version.
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  capability-contract:
    name: Compiler capability contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: raws-labs/tigris
          path: tigris-compiler
          ref: develop
      - name: Use matching compiler ref when available
        # Runtime releases first; until the compiler tag exists, check develop.
        env:
          COMPILER_REF: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          COMPILER_REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$COMPILER_REF_TYPE" = "tag" ]; then
            case "$COMPILER_REF" in
              v[0-9]*) python3 scripts/check_version_sources.py --expect "${COMPILER_REF#v}" ;;
              *) echo "Runtime release tags must use vX.Y.Z" >&2; exit 1 ;;
            esac
            remote_ref="refs/tags/$COMPILER_REF"
          else
            remote_ref="refs/heads/$COMPILER_REF"
          fi
          if git -C tigris-compiler ls-remote --exit-code --refs origin "$remote_ref"; then
            git -C tigris-compiler fetch --depth=1 origin "$remote_ref"
            git -C tigris-compiler checkout --detach FETCH_HEAD
          elif [ "$COMPILER_REF_TYPE" = "tag" ]; then
            echo "Matching compiler tag is not published yet; checking develop"
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the compiler
        run: python -m pip install -e "tigris-compiler[dev]"
      - name: Compare runtime dispatch with the canonical matrix
        run: >-
          python tigris-compiler/scripts/validate_runtime_capabilities.py
          --runtime .
      - name: Run the compiler/runtime numerical contract
        # Every contract case compiled by the matching compiler, executed by
        # this runtime and compared with ONNX Runtime.
        run: python tigris-compiler/scripts/crossrepo_contract.py --runtime .
      - name: Stage this runtime's host library in the compiler
        run: python tigris-compiler/scripts/runtime_bundle.py --source .
      - name: Run the TFLite and host contract suites on this runtime
        working-directory: tigris-compiler
        env:
          TIGRIS_REQUIRE_HOST: "1"
        run: >-
          python -m pytest -q
          tests/test_frontend_tflite.py tests/test_host_contract_cases.py

  native:
    name: Native ${{ matrix.compiler }}
    if: github.ref_type != 'tag'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {compiler: gcc, os: ubuntu-latest}
          - {compiler: clang, os: ubuntu-latest}
          # GCC 11 reports maybe-uninitialized cases at -O3 that newer GCC does not.
          - {compiler: gcc-11, os: ubuntu-22.04}
    steps:
      - uses: actions/checkout@v4
      - name: Check the version sources agree
        run: python3 scripts/check_version_sources.py
      - run: >-
          cmake -S . -B build-${{ matrix.compiler }}
          -DCMAKE_BUILD_TYPE=Release
          -DTIGRIS_BUILD_HOST=ON
          -DCMAKE_C_COMPILER=${{ matrix.compiler }}
      - run: cmake --build build-${{ matrix.compiler }} --parallel
      - run: ctest --test-dir build-${{ matrix.compiler }} --output-on-failure
      - run: >-
          cmake --install build-${{ matrix.compiler }}
          --prefix ${{ github.workspace }}/install-${{ matrix.compiler }}
      - run: >-
          cmake -S test/package_consumer
          -B build-consumer-${{ matrix.compiler }}
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=${{ matrix.compiler }}
          -DCMAKE_PREFIX_PATH=${{ github.workspace }}/install-${{ matrix.compiler }}
      - run: cmake --build build-consumer-${{ matrix.compiler }} --parallel
      - run: >-
          ctest --test-dir build-consumer-${{ matrix.compiler }}
          --output-on-failure

  sanitizers:
    name: ASan and UBSan
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: >-
          cmake -S . -B build-sanitize
          -DCMAKE_BUILD_TYPE=Debug
          -DTIGRIS_TRACE=ON
          -DTIGRIS_BUILD_HOST=ON
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - run: cmake --build build-sanitize --parallel
      - run: ctest --test-dir build-sanitize --output-on-failure
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

  static-analysis:
    name: Static analysis and MISRA regression
    if: github.ref_type != 'tag'
    runs-on: ubuntu-24.04
    env:
      CPPCHECK_COMMIT: 904cfdcf774c44b17db789c8a212e2f1c69fc833
    steps:
      - uses: actions/checkout@v4
      - name: Mutation-test the static-analysis checker
        run: python3 scripts/check_static_analysis.py --self-test
      - id: image
        run: echo "name=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
      - id: cppcheck
        uses: actions/cache@v4
        with:
          path: /tmp/cppcheck-build/bin
          key: cppcheck-${{ env.CPPCHECK_COMMIT }}-${{ runner.arch }}-${{ steps.image.outputs.name }}
      - name: Fetch the exact reviewed Cppcheck source
        if: steps.cppcheck.outputs.cache-hit != 'true'
        run: |
          git init /tmp/cppcheck
          git -C /tmp/cppcheck remote add origin https://github.com/cppcheck-opensource/cppcheck.git
          git -C /tmp/cppcheck fetch --depth=1 origin "$CPPCHECK_COMMIT"
          git -C /tmp/cppcheck checkout --detach FETCH_HEAD
          test "$(git -C /tmp/cppcheck rev-parse HEAD)" = "$CPPCHECK_COMMIT"
      - name: Build pinned Cppcheck 2.21.1
        if: steps.cppcheck.outputs.cache-hit != 'true'
        run: >-
          cmake -S /tmp/cppcheck -B /tmp/cppcheck-build
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_GUI=OFF
          -DBUILD_TESTING=OFF
      - if: steps.cppcheck.outputs.cache-hit != 'true'
        run: >-
          cmake --build /tmp/cppcheck-build
          --target cppcheck --parallel 2
      - name: Enforce correctness and reviewed MISRA findings
        run: >-
          python3 scripts/check_static_analysis.py
          --cppcheck /tmp/cppcheck-build/bin/cppcheck

  coverage:
    name: Deterministic runtime coverage
    if: github.ref_type != 'tag'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Mutation-test the coverage checker
        run: python3 scripts/check_coverage.py --self-test
      - name: Build with pinned GCC coverage instrumentation
        run: >-
          cmake -S . -B build-coverage
          -DCMAKE_BUILD_TYPE=Debug
          -DTIGRIS_TRACE=ON
          -DCMAKE_C_COMPILER=gcc-13
          -DCMAKE_C_FLAGS="-O0 -g --coverage"
          -DCMAKE_EXE_LINKER_FLAGS="--coverage"
      - run: cmake --build build-coverage --parallel
      - run: ctest --test-dir build-coverage --output-on-failure
      - name: Enforce per-file line and branch-outcome floors
        run: >-
          python3 scripts/check_coverage.py
          --gcov gcov-13 build-coverage

  loader-fuzz-smoke:
    name: Loader fuzz smoke
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p fuzz-artifacts
      - run: python3 test/make_fuzz_corpus.py fuzz-corpus
      - run: >-
          clang -std=c11 -Wall -Wextra -Wpedantic -Werror -ffp-contract=off
          -fsanitize=fuzzer,address,undefined -fno-omit-frame-pointer
          -Iinclude test/fuzz_loader.c src/tigris_loader.c src/tigris_band.c
          -o fuzz-loader
      - run: >-
          ./fuzz-loader fuzz-corpus -max_total_time=20 -timeout=2
          -artifact_prefix=fuzz-artifacts/
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: loader-fuzz-artifacts
          path: fuzz-artifacts/
          if-no-files-found: ignore

  cortex-m:
    name: Cortex-M cross-build
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update
      - run: >-
          sudo apt-get install --yes --no-install-recommends
          gcc-arm-none-eabi libnewlib-arm-none-eabi
      - run: >-
          cmake -S . -B build-arm
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE=cmake/arm-none-eabi.cmake
          -DCMAKE_C_FLAGS="-mcpu=cortex-m4 -mthumb"
          -DTIGRIS_STACK_USAGE=ON
      - run: cmake --build build-arm --target tigris_runtime --parallel
      - run: python3 scripts/check_stack_usage.py --max-frame 1024 build-arm

  stack-usage:
    name: Stack usage budget
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: >-
          cmake -S . -B build-stack
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=gcc
          -DTIGRIS_STACK_USAGE=ON
      - run: >-
          cmake --build build-stack
          --target tigris_runtime cmsis_adapter_compile explicit_workspace_link_smoke
          --parallel
      - run: python3 scripts/check_stack_usage.py --max-frame 1024 build-stack
      - run: >-
          python3 scripts/check_workspace_link.py
          build-stack/explicit_workspace_link_smoke
