name: Host libraries

on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_call:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            container: quay.io/pypa/manylinux_2_28_x86_64
            platform: manylinux_2_28_x86_64
          - runner: ubuntu-24.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64
            platform: manylinux_2_28_aarch64
          - runner: macos-15-intel
            platform: macosx_11_0_x86_64
          - runner: macos-14
            platform: macosx_11_0_arm64
          - runner: windows-2022
            platform: win_amd64
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Install native build tools in the Linux build image
        if: runner.os == 'Linux'
        run: |
          /opt/python/cp312-cp312/bin/python -m venv .venv
          .venv/bin/python -m pip install 'cmake>=3.20,<5' ninja
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Configure host library
        run: >-
          cmake -S . -B build-host -G Ninja
          -DCMAKE_BUILD_TYPE=Release -DTIGRIS_BUILD_HOST=ON
          -DTIGRIS_HOST_PLATFORM=${{ matrix.platform }}
          ${{ runner.os == 'Windows' && '-DCMAKE_C_COMPILER=clang' || '' }}
          ${{ runner.os == 'macOS' && '-DCMAKE_OSX_DEPLOYMENT_TARGET=11.0' || '' }}
      - run: cmake --build build-host --target test_host --parallel 4
      - run: ctest --test-dir build-host -R '^host_library$' --output-on-failure
      - run: cmake --build build-host --target host_archive
      - uses: actions/upload-artifact@v4
        with:
          name: host-${{ matrix.platform }}
          path: |
            build-host/host-artifacts/*.tar.gz
            build-host/host-artifacts/*.sha256
          if-no-files-found: error

  msvc:
    name: MSVC runtime and host library
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - run: >-
          cmake -S . -B build-msvc -G Ninja -DCMAKE_C_COMPILER=cl
          -DCMAKE_BUILD_TYPE=Release -DTIGRIS_BUILD_HOST=ON
      - run: cmake --build build-msvc --target tigris_runtime test_host --parallel 4
      - run: ctest --test-dir build-msvc -R '^host_library$' --output-on-failure

  publish:
    if: github.event_name == 'release'
    needs: [build, msvc]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python3 scripts/check_version_sources.py --expect "${RELEASE_TAG#v}"
      - uses: actions/download-artifact@v4
        with:
          pattern: host-*
          path: artifacts
          merge-multiple: true
      - name: Attach tested native archives
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" artifacts/*.tar.gz artifacts/*.sha256
