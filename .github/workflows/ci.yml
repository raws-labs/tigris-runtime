name: Runtime CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  capability-contract:
    name: Compiler capability contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: raws-labs/tigris
          path: tigris-compiler
          ref: develop
      - name: Use matching compiler branch when available
        env:
          COMPILER_REF: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
        run: |
          if git -C tigris-compiler ls-remote --exit-code --heads origin "$COMPILER_REF"; then
            git -C tigris-compiler fetch --depth=1 origin "$COMPILER_REF"
            git -C tigris-compiler checkout --detach FETCH_HEAD
          fi
      - name: Compare runtime dispatch with the canonical matrix
        env:
          PYTHONPATH: tigris-compiler/src
        run: >-
          python3 tigris-compiler/scripts/validate_runtime_capabilities.py
          --runtime .

  native:
    name: Native ${{ matrix.compiler }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - run: >-
          cmake -S . -B build-${{ matrix.compiler }}
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=${{ matrix.compiler }}
      - run: cmake --build build-${{ matrix.compiler }} --parallel
      - run: ctest --test-dir build-${{ matrix.compiler }} --output-on-failure
      - run: >-
          cmake --install build-${{ matrix.compiler }}
          --prefix ${{ github.workspace }}/install-${{ matrix.compiler }}
      - run: >-
          cmake -S test/package_consumer
          -B build-consumer-${{ matrix.compiler }}
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=${{ matrix.compiler }}
          -DCMAKE_PREFIX_PATH=${{ github.workspace }}/install-${{ matrix.compiler }}
      - run: cmake --build build-consumer-${{ matrix.compiler }} --parallel
      - run: >-
          ctest --test-dir build-consumer-${{ matrix.compiler }}
          --output-on-failure

  sanitizers:
    name: ASan and UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: >-
          cmake -S . -B build-sanitize
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - run: cmake --build build-sanitize --parallel
      - run: ctest --test-dir build-sanitize --output-on-failure
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

  coverage:
    name: Deterministic runtime coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Mutation-test the coverage checker
        run: python3 scripts/check_coverage.py --self-test
      - name: Build with pinned GCC coverage instrumentation
        run: >-
          cmake -S . -B build-coverage
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=gcc-13
          -DCMAKE_C_FLAGS="-O0 -g --coverage"
          -DCMAKE_EXE_LINKER_FLAGS="--coverage"
      - run: cmake --build build-coverage --parallel
      - run: ctest --test-dir build-coverage --output-on-failure
      - name: Enforce per-file line and branch-outcome floors
        run: >-
          python3 scripts/check_coverage.py
          --gcov gcov-13 build-coverage

  loader-fuzz-smoke:
    name: Loader fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p fuzz-artifacts
      - run: python3 test/make_fuzz_corpus.py fuzz-corpus
      - run: >-
          clang -std=c11 -Wall -Wextra -Wpedantic -Werror
          -fsanitize=fuzzer,address,undefined -fno-omit-frame-pointer
          -Iinclude test/fuzz_loader.c src/tigris_loader.c
          -o fuzz-loader
      - run: >-
          ./fuzz-loader fuzz-corpus -max_total_time=20 -timeout=2
          -artifact_prefix=fuzz-artifacts/
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: loader-fuzz-artifacts
          path: fuzz-artifacts/
          if-no-files-found: ignore

  cortex-m:
    name: Cortex-M cross-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update
      - run: >-
          sudo apt-get install --yes --no-install-recommends
          gcc-arm-none-eabi libnewlib-arm-none-eabi
      - run: >-
          cmake -S . -B build-arm
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE=cmake/arm-none-eabi.cmake
          -DCMAKE_C_FLAGS="-mcpu=cortex-m4 -mthumb"
          -DTIGRIS_STACK_USAGE=ON
      - run: cmake --build build-arm --target tigris_runtime --parallel
      - run: python3 scripts/check_stack_usage.py --max-frame 1024 build-arm

  stack-usage:
    name: Stack usage budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: >-
          cmake -S . -B build-stack
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=gcc
          -DTIGRIS_STACK_USAGE=ON
      - run: >-
          cmake --build build-stack
          --target tigris_runtime cmsis_adapter_compile explicit_workspace_link_smoke
          --parallel
      - run: python3 scripts/check_stack_usage.py --max-frame 1024 build-stack
      - run: >-
          python3 scripts/check_workspace_link.py
          build-stack/explicit_workspace_link_smoke
